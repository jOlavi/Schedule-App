version: "3.8"

services:
    db:
        image: postgres:16
        restart: always
        environment:
            POSTGRES_USER: scheduleuser
            POSTGRES_PASSWORD: schedulepass
            POSTGRES_DB: scheduleapp
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: adminpass
        ports:
            - "8888:80"
        depends_on:
            - db

volumes:
    db_data:
